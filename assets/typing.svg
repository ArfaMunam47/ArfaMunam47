<div align="center">

<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">

  <style>
    .role {
      font-family: Inter, Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;
      text-anchor: middle;
    }

    .cursor {
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    .role1 {
      fill: #B85C7A;
    }

    .role2 {
      fill: #D97757;
    }

    .role3 {
      fill: #8E75B2;
    }
  </style>

  <!-- Frontend Developer -->
  <text x="300" y="45" class="role role1">
    <tspan>Frontend Developer</tspan>
  </text>

  <!-- Prompt Engineer -->
  <text x="300" y="85" class="role role2">
    <tspan>Prompt Engineer</tspan>
  </text>

  <!-- AI Enthusiast -->
  <text x="300" y="125" class="role role3">
    <tspan>AI Enthusiast</tspan>
  </text>

</svg>

</div>
