    GITHUB STREAK
  </text>

  <text
    x="40"
    y="112"
    fill="url(#gold)"
    filter="url(#glow)"
    font-family="Arial, sans-serif"
    font-size="54"
    font-weight="700"
  >
    113
  </text>

  <text
    x="145"
    y="108"
    fill="#F4F4F5"
    font-family="Arial, sans-serif"
    font-size="23"
    font-weight="600"
  >
    day streak
  </text>

  <text
    x="40"
    y="145"
