    </filter>
  </defs>

  <rect
    x="2"
    y="2"
    width="516"
    height="176"
    rx="24"
    fill="#09090B"
    stroke="#27272A"
    stroke-width="1"
  />

  <text
    x="40"
    y="52"
    fill="#A1A1AA"
    font-family="Arial, sans-serif"
    font-size="15"
    letter-spacing="2"
