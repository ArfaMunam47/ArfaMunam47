name: Update Activity Trail

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  activity-trail:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Activity Trail
        uses: lowlighter/metrics@latest

        with:
          filename: activity-trail.svg

          token: ${{ secrets.GITHUB_TOKEN }}
          user: ArfaMunam47

          template: classic

          # Only the isometric activity calendar
          base: ""

          config_timezone: Asia/Karachi

          # Give the SVG enough width for the 3D composition
          config_display: large

          config_padding: 0

          # 180 days = roughly 6 months
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          extras_js: |

            /*
             * ==========================================
             * REMOVE DEFAULT METRICS UI
             * ==========================================
             */

            // Remove default calendar/header blocks
            document.querySelector(".field.calendar")?.remove();

            // Remove headings generated by the plugin
            document.querySelectorAll("h2").forEach((el) => {
              const text = el.textContent?.toLowerCase() || "";

              if (
                text.includes("contributions calendar") ||
                text.includes("calendar")
              ) {
                el.remove();
              }
            });


            /*
             * ==========================================
             * CREATE ACTIVITY TRAIL FRAME
             * ==========================================
             */

            const svg = document.querySelector("svg");

            if (svg) {

              svg.style.background = "#09090D";


              /*
               * Find the main activity area.
               * The existing isometric calendar remains
               * the actual GitHub-generated data.
               */

              const activity = document.querySelector(
                ".calendar-graph"
              );

              if (activity) {
                activity.setAttribute(
                  "transform",
                  "translate(80 35) scale(1.08)"
                );
              }


              /*
               * ========================================
               * ADD DAY LABELS
               * ========================================
               */

              const ns = "http://www.w3.org/2000/svg";

              function addText(
                text,
                x,
                y,
                size = 16,
                weight = "400"
              ) {
                const node =
                  document.createElementNS(ns, "text");

                node.textContent = text;

                node.setAttribute("x", x);
                node.setAttribute("y", y);

                node.setAttribute(
                  "font-family",
                  "Inter, Arial, sans-serif"
                );

                node.setAttribute(
                  "font-size",
                  size
                );

                node.setAttribute(
                  "font-weight",
                  weight
                );

                node.setAttribute(
                  "fill",
                  "#F2DCE5"
                );

                svg.appendChild(node);

                return node;
              }


              /*
               * ========================================
               * DAY LABELS
               * ========================================
               */

              addText("Mon", 24, 160, 14, "500");
              addText("Wed", 24, 210, 14, "500");
              addText("Fri", 24, 260, 14, "500");


              /*
               * ========================================
               * MONTH LABELS
               * ========================================
               */

              addText("MAR '26", 100, 360, 14, "600");
              addText("APR '26", 260, 410, 14, "600");
              addText("MAY '26", 420, 460, 14, "600");
              addText("JUN '26", 590, 510, 14, "600");
              addText("JUL '26", 760, 560, 14, "600");
              addText("AUG '26", 930, 610, 14, "600");
              addText("SEP '26", 1090, 660, 14, "600");


              /*
               * ========================================
               * LEGEND
               * ========================================
               */

              const legendGroup =
                document.createElementNS(ns, "g");

              legendGroup.setAttribute(
                "transform",
                "translate(70 735)"
              );

              svg.appendChild(legendGroup);


              function legendText(
                text,
                x,
                y
              ) {
                const node =
                  document.createElementNS(ns, "text");

                node.textContent = text;

                node.setAttribute("x", x);
                node.setAttribute("y", y);

                node.setAttribute(
                  "font-family",
                  "Inter, Arial, sans-serif"
                );

                node.setAttribute(
                  "font-size",
                  "14"
                );

                node.setAttribute(
                  "font-weight",
                  "600"
                );

                node.setAttribute(
                  "fill",
                  "#E875A0"
                );

                legendGroup.appendChild(node);
              }


              legendText("LESS", 0, 25);


              const legendColors = [
                "#25131D",
                "#54223A",
                "#863658",
                "#B94D78",
                "#F078A7"
              ];


              legendColors.forEach(
                (color, index) => {

                  const cube =
                    document.createElementNS(
                      ns,
                      "rect"
                    );

                  cube.setAttribute(
                    "x",
                    65 + index * 34
                  );

                  cube.setAttribute(
                    "y",
                    8
                  );

                  cube.setAttribute(
                    "width",
                    22
                  );

                  cube.setAttribute(
                    "height",
                    22
                  );

                  cube.setAttribute(
                    "rx",
                    4
                  );

                  cube.setAttribute(
                    "fill",
                    color
                  );

                  cube.setAttribute(
                    "stroke",
                    "#0A080D"
                  );

                  legendGroup.appendChild(cube);
                }
              );


              legendText(
                "MORE",
                250,
                25
              );


              /*
               * ========================================
               * STAT CARDS
               * ========================================
               */

              const stats = [
                {
                  icon: "ϟ",
                  value: "766",
                  label: "Contributions"
                },
                {
                  icon: "▣",
                  value: "33",
                  label: "Public Repos"
                },
                {
                  icon: "◷",
                  value: "9",
                  label: "Months"
                },
                {
                  icon: "☆",
                  value: "2",
                  label: "Stars"
                }
              ];


              const startX = 620;
              const startY = 710;
              const cardWidth = 175;
              const cardHeight = 72;
              const gap = 18;


              stats.forEach(
                (stat, index) => {

                  const group =
                    document.createElementNS(
                      ns,
                      "g"
                    );

                  group.setAttribute(
                    "transform",
                    `translate(${startX +
                      index *
                      (cardWidth + gap)}
                      ${startY})`
                  );


                  /*
                   * Card background
                   */

                  const card =
                    document.createElementNS(
                      ns,
                      "rect"
                    );

                  card.setAttribute(
                    "width",
                    cardWidth
                  );

                  card.setAttribute(
                    "height",
                    cardHeight
                  );

                  card.setAttribute(
                    "rx",
                    "12"
                  );

                  card.setAttribute(
                    "fill",
                    "#0D0A10"
                  );

                  card.setAttribute(
                    "stroke",
                    "#A83F69"
                  );

                  card.setAttribute(
                    "stroke-width",
                    "1.5"
                  );

                  group.appendChild(card);


                  /*
                   * Icon
                   */

                  const icon =
                    document.createElementNS(
                      ns,
                      "text"
                    );

                  icon.textContent =
                    stat.icon;

                  icon.setAttribute(
                    "x",
                    "18"
                  );

                  icon.setAttribute(
                    "y",
                    "31"
                  );

                  icon.setAttribute(
                    "font-size",
                    "25"
                  );

                  icon.setAttribute(
                    "font-family",
                    "Arial"
                  );

                  icon.setAttribute(
                    "fill",
                    "#F078A7"
                  );

                  group.appendChild(icon);


                  /*
                   * Number
                   */

                  const value =
                    document.createElementNS(
                      ns,
                      "text"
                    );

                  value.textContent =
                    stat.value;

                  value.setAttribute(
                    "x",
                    "55"
                  );

                  value.setAttribute(
                    "y",
                    "30"
                  );

                  value.setAttribute(
                    "font-size",
                    "22"
                  );

                  value.setAttribute(
                    "font-weight",
                    "700"
                  );

                  value.setAttribute(
                    "font-family",
                    "Inter, Arial, sans-serif"
                  );

                  value.setAttribute(
                    "fill",
                    "#FFFFFF"
                  );

                  group.appendChild(value);


                  /*
                   * Label
                   */

                  const label =
                    document.createElementNS(
                      ns,
                      "text"
                    );

                  label.textContent =
                    stat.label;

                  label.setAttribute(
                    "x",
                    "55"
                  );

                  label.setAttribute(
                    "y",
                    "52"
                  );

                  label.setAttribute(
                    "font-size",
                    "12"
                  );

                  label.setAttribute(
                    "font-family",
                    "Inter, Arial, sans-serif"
                  );

                  label.setAttribute(
                    "fill",
                    "#D99AAF"
                  );

                  group.appendChild(label);


                  svg.appendChild(group);
                }
              );
            }


          extras_css: |

            /*
             * ==========================================
             * GLOBAL
             * ==========================================
             */

            svg {
              background: #09090D !important;
            }

            text {
              fill: #F2DCE5 !important;
              font-family: Inter, Arial, sans-serif !important;
            }


            /*
             * ==========================================
             * REMOVE DEFAULT TITLE
             * ==========================================
             */

            h2 {
              display: none !important;
            }


            /*
             * ==========================================
             * ISOMETRIC GRID
             * ==========================================
             */

            .calendar-graph {
              opacity: 1 !important;
            }


            /*
             * Pink contribution palette
             */

            .calendar-graph rect {
              stroke: #09090D !important;
              rx: 3px !important;
            }


            /*
             * Darkest / inactive
             */

            .calendar-graph rect[data-level="0"] {
              fill: #25131D !important;
            }


            /*
             * Low
             */

            .calendar-graph rect[data-level="1"] {
              fill: #54223A !important;
            }


            /*
             * Medium
             */

            .calendar-graph rect[data-level="2"] {
              fill: #863658 !important;
            }


            /*
             * High
             */

            .calendar-graph rect[data-level="3"] {
              fill: #B94D78 !important;
            }


            /*
             * Maximum
             */

            .calendar-graph rect[data-level="4"] {
              fill: #F078A7 !important;
            }


            /*
             * ==========================================
             * REMOVE DEFAULT EXCESS SPACING
             * ==========================================
             */

            .field {
              margin: 0 !important;
              padding: 0 !important;
            }
