name: Update Activity Trail

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  activity-trail:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Activity Trail
        uses: lowlighter/metrics@latest
        with:
          filename: activity-trail.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ArfaMunam47

          template: classic
          base: ""

          config_timezone: Asia/Karachi
          config_display: regular
          config_padding: 0

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          extras_css: |
            svg {
              background: #17151A !important;
            }
            text {
              fill: #E8C8D2 !important;
            }
